<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفع نتائج البتانون</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>body{font-family:Tahoma;background:#0a1f44;color:#fff;padding:20px;text-align:center}.box{background:#fff;color:#222;max-width:520px;margin:20px auto;padding:22px;border-radius:12px}input{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:8px;text-align:center}button{background:#d4a017;border:none;padding:13px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px}button:disabled{opacity:.6}#s{margin-top:12px;font-weight:bold}</style>
</head>
<body>
<h3>رفع كشف الدرجات - البتانون</h3>
<div class="box" id="lock">
<input type="password" id="pw" placeholder="كلمة سر الإدارة">
<button onclick="chk()">دخول</button>
</div>
<div class="box" id="main" style="display:none">
<input type="file" id="f" accept=".xlsx,.xls,.csv">
<button id="btn" onclick="up()">رفع الكشف</button>
<div id="s"></div>
</div>
<script>
const PASS="batanoun123";
function chk(){ if(document.getElementById('pw').value===PASS){document.getElementById('lock').style.display='none';document.getElementById('main').style.display='block';} else alert("كلمة السر غلط"); }
firebase.initializeApp({apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",authDomain:"school-d50aa.firebaseapp.com",projectId:"school-d50aa",storageBucket:"school-d50aa.firebasestorage.app",messagingSenderId:"14520467716",appId:"1:14520467716:web:a9874d7152ab6e4b255051"});
const db=firebase.firestore();
const SUBS=["اللغة العربية","اللغة الأجنبية الأولى","الرياضيات","العلوم المتكاملة","التاريخ","الفلسفة والمنطق","اللغة الأجنبية الثانية","التربية الدينية","البرمجة وعلوم الحاسب","المجموع"];
async function up(){
const file=document.getElementById('f').files[0]; if(!file) return alert("اختار الملف");
let btn=document.getElementById('btn'); btn.disabled=true; btn.innerText="جاري الرفع...";
document.getElementById('s').innerText="جاري القراءة...";
try{
const buf=await file.arrayBuffer(); const wb=XLSX.read(buf); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws);
let c=0;
for(const r of rows){
let seat=String(r["رقم الجلوس"]||"").trim(); let name=String(r["الاسم"]||"").trim(); if(!seat||!name) continue;
let subjects={}; SUBS.forEach(k=>{ if(r[k]!==undefined && r[k]!=="") subjects[k]=String(r[k]); });
await db.collection("results").doc(seat).set({seat:seat,name:name,subjects:subjects,total:subjects["المجموع"]||"",createdAt:Date.now()},{merge:true});
c++; document.getElementById('s').innerText="تم رفع "+c+" طالب...";
}
document.getElementById('s').innerText="تم بنجاح: "+c+" طالب"; alert("خلص ✅ "+c);
}catch(e){document.getElementById('s').innerText="خطأ: "+e.message;}
btn.disabled=false; btn.innerText="رفع الكشف";
}
</script>
</body>
</html>
