<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفع النتائج - مدرسة البتانون الثانوية المطورة</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial;margin:0;padding:0}
:root{--navy:#0a1f44;--gold:#d4a017}
body{background:#f1f5f9;min-height:100vh}
.header{background:var(--navy);color:#fff;padding:20px;text-align:center}
.header img{width:70px;height:70px;border-radius:50%;border:3px solid var(--gold);margin-bottom:10px;object-fit:cover}
.card{background:#fff;max-width:700px;margin:20px auto;padding:25px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
label{font-weight:bold;color:var(--navy);display:block;margin:12px 0 6px}
select,input[type=file]{width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;margin-bottom:10px}
.btn{background:var(--gold);color:var(--navy);border:none;padding:14px;border-radius:10px;font-weight:bold;width:100%;font-size:17px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.6;cursor:wait}
.btn-navy{background:var(--navy);color:#fff}
#status{margin-top:15px;padding:12px;border-radius:10px;display:none}
.success{background:#dcfce7;color:#166534;border:1px solid #22c55e}
.error{background:#fee2e2;color:#991b1b;border:1px solid #ef4444}
.info{background:#e0f2fe;color:#075985;border:1px solid #0ea5e9}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
th,td{border:1px solid #e2e8f0;padding:8px;text-align:center}
th{background:var(--navy);color:#fff}
.back{display:inline-block;margin:15px;background:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;color:var(--navy);font-weight:bold}
</style>
</head>
<body>
<div class="header">
<img src="https://i.ibb.co/SD12XjKb/file-00000000a8b8824398c2d1d125682b5c.png">
<h2>📤 رفع النتائج</h2>
<p>مدرسة البتانون الثانوية المطورة</p>
</div>

<a href="index.html" class="back">⬅️ رجوع للرئيسية</a>

<div class="card">
<h3 style="color:#0a1f44;margin-bottom:15px">اختر الصف الدراسي</h3>

<label>الصف:</label>
<select id="grade">
<option value="1">الصف الأول الثانوي</option>
<option value="2">الصف الثاني الثانوي</option>
<option value="3">الصف الثالث الثانوي</option>
</select>

<label>ملف Excel:</label>
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
<p style="color:#64748b;font-size:13px;margin:8px 0">ملف Excel لازم يكون فيه أعمدة: رقم الجلوس | الاسم | ثم درجات المواد | المجموع</p>

<button class="btn" id="previewBtn" onclick="previewExcel()">👁️ معاينة الملف</button>
<button class="btn btn-navy" id="uploadBtn" onclick="uploadToFirebase()" disabled>🚀 رفع النتائج للصف المختار</button>

<div id="status"></div>
<div id="preview"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",authDomain:"school-d50aa.firebaseapp.com",projectId:"school-d50aa",storageBucket:"school-d50aa.firebasestorage.app",messagingSenderId:"14520467716",appId:"1:14520467716:web:a9874d7152ab6e4b255051"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let parsedData=[];

function showStatus(msg,type){
let s=document.getElementById('status');
s.style.display='block';
s.className=type;
s.innerHTML=msg;
}

window.previewExcel=async function(){
let file=document.getElementById('excelFile').files[0];
if(!file) return showStatus('اختار ملف Excel الأول','error');
let grade=document.getElementById('grade').value;
let gradeName=document.getElementById('grade').selectedOptions[0].text;

let data=await file.arrayBuffer();
let wb=XLSX.read(data);
let ws=wb.Sheets[wb.SheetNames[0]];
let rows=XLSX.utils.sheet_to_json(ws,{header:1});
if(rows.length<2) return showStatus('الملف فاضي','error');

let headers=rows[0].map(h=>String(h).trim());
parsedData=[];
for(let i=1;i<rows.length;i++){
let r=rows[i];
if(!r[0]) continue;
let obj={seat:String(r[0]).trim(), name:String(r[1]||'').trim(), grade:grade};
let subjects={};
for(let j=2;j<headers.length;j++){
subjects[headers[j]]=r[j]||'';
}
obj.subjects=subjects;
obj.total=r[headers.length-1]||subjects['المجموع']||'';
parsedData.push(obj);
}

document.getElementById('preview').innerHTML=`<h4 style="margin:15px 0">معاينة - ${gradeName} (${parsedData.length} طالب)</h4><div style="overflow-x:auto"><table><tr><th>رقم الجلوس</th><th>الاسم</th><th>المجموع</th></tr>${parsedData.slice(0,10).map(p=>`<tr><td>${p.seat}</td><td>${p.name}</td><td>${p.total}</td></tr>`).join('')}</table></div>${parsedData.length>10?`<p style="color:#64748b">... و ${parsedData.length-10} طالب آخر</p>`:''}`;
document.getElementById('uploadBtn').disabled=false;
showStatus(`تم قراءة ${parsedData.length} طالب للـ ${gradeName} ✅`,'success');
};

window.uploadToFirebase=async function(){
if(!parsedData.length) return;
let grade=document.getElementById('grade').value;
let gradeName=document.getElementById('grade').selectedOptions[0].text;
if(!confirm(`متأكد عايز ترفع ${parsedData.length} نتيجة للـ ${gradeName}؟\nالنتائج القديمة لنفس الصف هتتمسح.`)) return;

let btn=document.getElementById('uploadBtn');
btn.disabled=true; btn.innerText='جاري الرفع...';
showStatus('جاري مسح النتائج القديمة لنفس الصف...','info');

try{
// امسح القديم لنفس الصف بس
let oldQ=query(collection(db,"results"), where("grade","==",grade));
let oldSnap=await getDocs(oldQ);
for(let d of oldSnap.docs){ await deleteDoc(d.ref); }

showStatus(`جاري رفع ${parsedData.length} نتيجة...`,'info');
let count=0;
for(let p of parsedData){
await addDoc(collection(db,"results"), p);
count++;
if(count%20==0) showStatus(`تم رفع ${count} من ${parsedData.length}...`,'info');
}
showStatus(`تم رفع نتائج ${gradeName} بنجاح ✅ (${count} طالب)`,'success');
document.getElementById('preview').innerHTML='';
parsedData=[];
}catch(e){
showStatus('خطأ: '+e.message,'error');
}
btn.disabled=false; btn.innerText='🚀 رفع النتائج للصف المختار';
};

onAuthStateChanged(auth,(user)=>{
if(!user){ window.location.href='index.html'; }
});
</script>
</body>
  </html>
