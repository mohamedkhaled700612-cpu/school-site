<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="UTF-8"><title>رفع النتائج</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<h2>رفع نتائج أولى ثانوي من Excel</h2>
<div id="loginDiv">
<input type="email" id="email" value="admin@batanoun.com"><br><br>
<input type="password" id="password" placeholder="الباسورد"><br><br>
<button onclick="login()">دخول</button>
</div>
<div id="uploadDiv" style="display:none">
<input type="file" id="file" accept=".xlsx,.xls"><br><br>
<button onclick="upload()">رفع الملف</button>
<p id="status"></p>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",
  authDomain: "school-d50aa.firebaseapp.com",
  projectId: "school-d50aa",
  storageBucket: "school-d50aa.firebasestorage.app",
  messagingSenderId: "14520467716",
  appId: "1:14520467716:web:a9874d7152ab6e4b255051"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
function login(){
  auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
 .then(()=>{document.getElementById('loginDiv').style.display='none';document.getElementById('uploadDiv').style.display='block';})
 .catch(e=>alert(e.message));
}
async function upload(){
  const file=document.getElementById('file').files[0];
  if(!file){alert('اختار الملف');return;}
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data);
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  let count=0;
  const اساسي=['اللغة العربية','اللغة الإنجليزية','الرياضيات','العلوم المتكاملة','التاريخ','الفلسفة والمنطق'];
  for(const r of rows){
    const الصف=String(r['الصف']).trim();
    const رقم=String(r['رقم الجلوس']).trim();
    const id=الصف+'_'+رقم;
    let المجموع=0;
    اساسي.forEach(m=>{ المجموع+=Number(r[m]||0); });
    await db.collection('results').doc(id).set({
      grade: الصف, seat_number: رقم, name: r['الاسم'],
      subjects: {
        'اللغة العربية': r['اللغة العربية'],
        'اللغة الإنجليزية': r['اللغة الإنجليزية'],
        'الرياضيات': r['الرياضيات'],
        'العلوم المتكاملة': r['العلوم المتكاملة'],
        'التاريخ': r['التاريخ'],
        'الفلسفة والمنطق': r['الفلسفة والمنطق'],
        'اللغة الأجنبية الثانية': r['اللغة الأجنبية الثانية'],
        'التربية الدينية': r['التربية الدينية'],
        'البرمجة وعلوم الحاسب': r['البرمجة وعلوم الحاسب']
      },
      total: المجموع, createdAt: new Date()
    });
    count++;
    document.getElementById('status').innerText='تم رفع '+count+' / '+rows.length;
  }
  document.getElementById('status').innerText='خلصنا! تم رفع '+count+' طالب';
}
</script>
</body>
</html>
