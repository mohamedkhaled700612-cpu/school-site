<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع النتائج | مدرسة البتانون الثانوية المطورة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#1a3a5f,#2c5f8a);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:480px;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.logo{font-size:48px;margin-bottom:10px}
h2{color:#1a3a5f;margin:0 0 8px}
.sub{color:#666;font-size:14px;margin-bottom:24px}
input[type=email],input[type=password]{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;margin-bottom:12px;outline:none}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#1a3a5f,#2c5f8a);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.file-box{border:2px dashed #2c5f8a;border-radius:12px;padding:30px 20px;margin:20px 0;cursor:pointer;background:#f8fbff;display:block}
.file-box span{font-size:16px;color:#2c5f8a;font-weight:bold}
#fileName{margin-top:10px;font-size:13px;color:#666}
.progress{height:10px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin:15px 0;display:none}
.progress div{height:100%;background:#27ae60;width:0%}
#status{font-size:14px;margin-top:10px;min-height:20px}
.tips{background:#fff8e1;border-radius:10px;padding:12px;font-size:13px;color:#795548;text-align:right;margin-top:20px;line-height:1.8}
</style>
</head>
<body>
<div class="card">
<div id="loginDiv">
<div class="logo">🔐</div>
<h2>لوحة الإدارة</h2>
<p class="sub">مدرسة البتانون الثانوية المطورة</p>
<input type="email" id="email" value="admin@batanoun.com" placeholder="البريد الإلكتروني">
<input type="password" id="password" placeholder="كلمة السر">
<button class="btn" onclick="login()">دخول</button>
</div>
<div id="uploadDiv" style="display:none">
<div class="logo">📊</div>
<h2>رفع نتائج أولى ثانوي</h2>
<p class="sub">مدرسة البتانون الثانوية المطورة</p>
<label for="file" class="file-box"><span>📁 اضغط لاختيار ملف Excel</span><div id="fileName">لم يتم اختيار ملف بعد</div></label>
<input type="file" id="file" accept=".xlsx,.xls" style="display:none" onchange="document.getElementById('fileName').innerText=this.files[0]?this.files[0].name:'لم يتم اختيار ملف بعد'">
<div class="progress" id="progWrap"><div id="prog"></div></div>
<button class="btn" id="upBtn" onclick="upload()">🚀 رفع الملف</button>
<p id="status"></p>
<div class="tips">💡 <b>شكل ملف Excel:</b><br>- عمود الصف<br>- عمود رقم الجلوس<br>- عمود الاسم<br>- أعمدة المواد</div>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",authDomain:"school-d50aa.firebaseapp.com",projectId:"school-d50aa",storageBucket:"school-d50aa.firebasestorage.app",messagingSenderId:"14520467716",appId:"1:14520467716:web:a9874d7152ab6e4b255051"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();const db=firebase.firestore();
function login(){auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('password').value).then(()=>{document.getElementById('loginDiv').style.display='none';document.getElementById('uploadDiv').style.display='block';}).catch(e=>alert(e.message));}
async function upload(){
const file=document.getElementById('file').files[0];if(!file){alert('اختار ملف');return;}
const btn=document.getElementById('upBtn');btn.disabled=true;document.getElementById('progWrap').style.display='block';
const prog=document.getElementById('prog');const status=document.getElementById('status');
try{
const data=await file.arrayBuffer();const wb=XLSX.read(data);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
let c=0;for(const r of rows){const s=String(r['الصف']||'').trim();const n=String(r['رقم الجلوس']||'').trim();if(!s||!n)continue;
const tot=(+r['اللغة العربية']||0)+(+r['اللغة الإنجليزية']||0)+(+r['الرياضيات']||0)+(+r['العلوم المتكاملة']||0)+(+r['التاريخ']||0)+(+r['الفلسفة والمنطق']||0);
await db.collection('results').doc(s+'_'+n).set({grade:s,seat_number:n,name:r['الاسم']||'',subjects:{'اللغة العربية':+r['اللغة العربية']||0,'اللغة الإنجليزية':+r['اللغة الإنجليزية']||0,'الرياضيات':+r['الرياضيات']||0,'العلوم المتكاملة':+r['العلوم المتكاملة']||0,'التاريخ':+r['التاريخ']||0,'الفلسفة والمنطق':+r['الفلسفة والمنطق']||0,'اللغة الأجنبية الثانية':+r['اللغة الأجنبية الثانية']||0,'التربية الدينية':+r['التربية الدينية']||0,'البرمجة وعلوم الحاسب':+r['البرمجة وعلوم الحاسب']||0},total:tot,createdAt:new Date()});
c++;prog.style.width=(c/rows.length*100)+'%';status.innerText=c+' / '+rows.length;}
status.innerHTML='<b style="color:green">✅ تم رفع '+c+' طالب</b>';
}catch(e){status.innerText='❌ '+e.message;}
btn.disabled=false;
}
</script>
</body>
</html>
