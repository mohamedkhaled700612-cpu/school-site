<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتيجة البتانون</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}body{background:#0a1f44;color:#fff;text-align:center;padding:20px}.card{background:#fff;color:#222;max-width:460px;margin:20px auto;padding:22px;border-radius:15px;text-align:right}input{width:100%;padding:13px;margin:10px 0;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:16px}button{background:#d4a017;border:none;padding:13px;width:100%;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px}.row{display:flex;justify-content:space-between;padding:11px 5px;border-bottom:1px solid #eee}.sec{margin:10px 0 5px;font-weight:bold;color:#0a1f44;background:#fef9c3;padding:8px;border-radius:8px;text-align:center}</style>
</head>
<body>
<h2>نتيجة مدرسة البتانون</h2>
<div class="card"><input id="seat" placeholder="اكتب رقم الجلوس"><button onclick="go()">عرض النتيجة</button><div id="r" style="margin-top:15px"></div></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",authDomain:"school-d50aa.firebaseapp.com",projectId:"school-d50aa",storageBucket:"school-d50aa.firebasestorage.app",messagingSenderId:"14520467716",appId:"1:14520467716:web:a9874d7152ab6e4b255051"});
const db=firebase.firestore();
const basic=["اللغة العربية","اللغة الأجنبية الأولى","الرياضيات","العلوم المتكاملة","التاريخ","الفلسفة والمنطق"];
const extra=["اللغة الأجنبية الثانية","التربية الدينية","البرمجة وعلوم الحاسب"];
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
async function go(){
let s=document.getElementById('seat').value.trim(); if(!s) return alert("اكتب رقم الجلوس");
document.getElementById('r').innerHTML="جاري البحث...";
let snap=await db.collection("results").get(); let f=null; snap.forEach(d=>{if(String(d.data().seat)===s) f=d.data();});
if(!f){document.getElementById('r').innerHTML="غير موجود"; return;}
let h="<h3 style='text-align:center;color:#15803d'>"+esc(f.name)+"<br><small style='color:#666'>"+esc(f.seat)+"</small></h3>";
h+="<div class='sec'>المواد الأساسية (داخل المجموع)</div>";
basic.forEach(k=>{if(f.subjects&&f.subjects[k]!==undefined) h+="<div class='row'><span>"+k+"</span><b>"+esc(f.subjects[k])+"</b></div>";});
if(f.subjects&&f.subjects["المجموع"]) h+="<div class='row' style='background:#f0fdf4'><span>المجموع</span><b>"+esc(f.subjects["المجموع"])+"</b></div>";
h+="<div class='sec'>مواد خارج المجموع</div>";
extra.forEach(k=>{if(f.subjects&&f.subjects[k]!==undefined) h+="<div class='row'><span>"+k+"</span><b>"+esc(f.subjects[k])+"</b></div>";});
document.getElementById('r').innerHTML=h;
}
</script>
</body>
  </html>
