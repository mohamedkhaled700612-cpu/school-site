<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتيجة مدرسة البتانون الثانوية</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial;margin:0;padding:0}
body{background:#0a1f44;color:#fff;text-align:center;padding:20px;min-height:100vh}
.logo{width:90px;height:90px;border-radius:50%;border:3px solid #d4a017;object-fit:cover;margin-bottom:10px}
.card{background:#fff;color:#222;max-width:460px;margin:20px auto;padding:22px;border-radius:15px;text-align:right;box-shadow:0 10px 30px rgba(0,0,0,.3)}
input{width:100%;padding:13px;margin:10px 0;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:16px;outline:none}
button{background:#d4a017;border:none;padding:13px;width:100%;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px;color:#0a1f44}
.row{display:flex;justify-content:space-between;padding:11px 5px;border-bottom:1px solid #eee;font-size:15px}
.row:last-child{border:none;background:#f0fdf4;border-radius:8px;margin-top:5px;padding:12px 8px}
.row b{color:#0a1f44}
</style>
</head>
<body>
<img class="logo" src="https://i.ibb.co/SD12XjKb/file-00000000a8b8824398c2d1d125682b5c.png">
<h2>مدرسة البتانون الثانوية المطورة</h2>
<p style="opacity:.7;font-size:14px;margin-top:5px">استعلم عن نتيجتك برقم الجلوس</p>
<div class="card">
<input id="seat" placeholder="اكتب رقم الجلوس" inputmode="numeric">
<button onclick="go()">عرض النتيجة</button>
<div id="r" style="margin-top:15px"></div>
</div>
<div style="opacity:.5;font-size:12px;margin-top:15px">Made by Mohamed Khaled © 2026</div>
<script>
firebase.initializeApp({
apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",
authDomain:"school-d50aa.firebaseapp.com",
projectId:"school-d50aa",
storageBucket:"school-d50aa.firebasestorage.app",
messagingSenderId:"14520467716",
appId:"1:14520467716:web:a9874d7152ab6e4b255051"
});
const db = firebase.firestore();
const order = ["عربي","علوم متكامله","رياضيات","انجليزي","تاريخ","برمجه","حاسب آلي","فلسفه ومنطق","المجموع"];
function esc(s){ if(!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function go(){
const s = document.getElementById('seat').value.trim();
if(!s){ alert("اكتب رقم الجلوس"); return; }
document.getElementById('r').innerHTML = "<div style='text-align:center;color:#64748b'>جاري البحث...</div>";
try{
const snap = await db.collection("results").get();
let f = null;
snap.forEach(d => { if(String(d.data().seat) === s) f = d.data(); });
if(!f){ document.getElementById('r').innerHTML = "<div style='text-align:center;padding:20px;color:#94a3b8'>رقم الجلوس غير موجود</div>"; return; }
let html = "<h3 style='text-align:center;color:#15803d;margin-bottom:12px'>" + esc(f.name) + "<br><small style='color:#64748b;font-weight:normal'>رقم الجلوس: " + esc(f.seat) + "</small></h3>";
order.forEach(k => {
if(f.subjects && f.subjects[k]!== undefined){
const isTotal = (k === "المجموع");
html += "<div class='row'><span>" + esc(k) + "</span><b>" + esc(f.subjects[k]) + "</b></div>";
}
});
document.getElementById('r').innerHTML = html;
}catch(e){ alert("خطأ: " + e.message); }
}
</script>
</body>
</html>
