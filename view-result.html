<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتيجة البتانون</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>*{box-sizing:border-box;font-family:Tahoma;margin:0;padding:0}body{background:#0a1f44;color:#fff;text-align:center;padding:20px}.card{background:#fff;color:#222;max-width:460px;margin:20px auto;padding:22px;border-radius:15px;text-align:right}input,select{width:100%;padding:13px;margin:10px 0;border:2px solid #e2e8f0;border-radius:10px;text-align:center;font-size:16px}button{background:#d4a017;border:none;padding:13px;width:100%;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px;margin-top:8px}.row{display:flex;justify-content:space-between;padding:11px 5px;border-bottom:1px solid #eee}.sec{margin:10px 0 5px;font-weight:bold;color:#0a1f44;background:#fef9c3;padding:8px;border-radius:8px;text-align:center}@media print{body{background:#fff}button,input,select,h2{display:none}.card{box-shadow:none;max-width:100%}}</style>
</head>
<body>
<h2>نتيجة مدرسة البتانون</h2>
<div class="card">
<select id="grade">
<option value="1">الصف الأول الثانوي</option>
<option value="2">الصف الثاني الثانوي</option>
<option value="3">الصف الثالث الثانوي</option>
</select>
<input id="seat" placeholder="اكتب رقم الجلوس"><button id="btn" onclick="go()">عرض النتيجة</button><div id="r" style="margin-top:15px"></div><button id="pb" style="display:none;background:#0a1f44;color:#fff" onclick="window.print()">اطبع النتيجة / حفظ PDF</button></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",authDomain:"school-d50aa.firebaseapp.com",projectId:"school-d50aa",storageBucket:"school-d50aa.firebasestorage.app",messagingSenderId:"14520467716",appId:"1:14520467716:web:a9874d7152ab6e4b255051"});
const db=firebase.firestore();
const basic=["اللغة العربية","اللغة الأجنبية الأولى","الرياضيات","العلوم المتكاملة","التاريخ","الفلسفة والمنطق"];
const extra=["اللغة الأجنبية الثانية","التربية الدينية","البرمجة وعلوم الحاسب"];
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
async function go(){
let s=document.getElementById('seat').value.trim(); if(!s) return alert("اكتب رقم الجلوس");
let grade=document.getElementById('grade').value;
let gradeName=document.getElementById('grade').selectedOptions[0].text;
let btn=document.getElementById('btn'); btn.disabled=true; btn.innerText="جاري البحث...";
document.getElementById('r').innerHTML="جاري البحث في "+gradeName+"..."; document.getElementById('pb').style.display='none';
try{
let snap=await db.collection("results").where("seat","==",s).where("grade","==",grade).limit(1).get();
// fallback للداتا القديمة اللي من غير grade
if(snap.empty){
let snap2=await db.collection("results").where("seat","==",s).limit(1).get();
if(!snap2.empty &&!snap2.docs[0].data().grade){ snap=snap2; }
}
if(snap.empty){document.getElementById('r').innerHTML="رقم الجلوس غير موجود في "+gradeName; btn.disabled=false; btn.innerText="عرض النتيجة"; return;}
let f=snap.docs[0].data();
let h="<h3 style='text-align:center;color:#15803d'>"+esc(f.name)+"<br><small style='color:#666'>رقم الجلوس: "+esc(f.seat)+" | "+gradeName+"</small></h3>";
h+="<div class='sec'>المواد الأساسية (داخل المجموع)</div>";
basic.forEach(k=>{if(f.subjects&&f.subjects[k]!==undefined&&f.subjects[k]!=="") h+="<div class='row'><span>"+k+"</span><b>"+esc(f.subjects[k])+"</b></div>";});
if(f.subjects&&f.subjects["المجموع"]) h+="<div class='row' style='background:#f0fdf4'><span>المجموع</span><b>"+esc(f.subjects["المجموع"])+"</b></div>";
h+="<div class='sec'>مواد خارج المجموع</div>";
extra.forEach(k=>{if(f.subjects&&f.subjects[k]!==undefined&&f.subjects[k]!=="") h+="<div class='row'><span>"+k+"</span><b>"+esc(f.subjects[k])+"</b></div>";});
document.getElementById('r').innerHTML=h; document.getElementById('pb').style.display='block';
}catch(e){document.getElementById('r').innerHTML="حصل خطأ في الاتصال";}
btn.disabled=false; btn.innerText="عرض النتيجة";
}
</script>
</body>
</html>
